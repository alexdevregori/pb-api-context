name: Weekly skill tests

on:
  schedule:
    # Sundays at 08:00 UTC.
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  static-smoke-test:
    name: Static smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install smoke-test deps
        working-directory: smoke-test
        run: npm ci || npm install

      - name: Run static smoke test
        id: smoke
        working-directory: smoke-test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node test.mjs
        continue-on-error: true

      - name: Open issue on static failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try { body = fs.readFileSync('smoke-test/report.md', 'utf8'); }
            catch (e) { body = `Static smoke test failed before generating a report.`; }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Static smoke test failed (${new Date().toISOString().slice(0,10)})`,
              body: `Static skill verification failed — the skill may have stopped activating, or Claude is referencing endpoints that don't exist in the specs.\n\n${body}\n\n[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['smoke-test-failure', 'productboard-api']
            });

      - name: Fail job on static failure
        if: steps.smoke.outcome == 'failure'
        run: exit 1

  integration-test:
    name: Integration test (real sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install integration-test deps
        working-directory: integration-test
        run: pip install -r requirements.txt

      - name: Run integration test
        id: integration
        working-directory: integration-test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PB_SANDBOX_TOKEN: ${{ secrets.PB_SANDBOX_TOKEN }}
        run: |
          set +e
          python test.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          exit 0
        continue-on-error: true

      - name: Categorize result
        id: triage
        run: |
          # Exit code 1 = skill bug (open issue), 2 = infra only (warn, don't issue)
          EXIT=${{ steps.integration.outputs.exit_code }}
          if [ "$EXIT" = "1" ]; then
            echo "category=skill-bug" >> $GITHUB_OUTPUT
          elif [ "$EXIT" = "2" ]; then
            echo "category=infra" >> $GITHUB_OUTPUT
          elif [ "$EXIT" = "0" ]; then
            echo "category=pass" >> $GITHUB_OUTPUT
          else
            echo "category=harness-error" >> $GITHUB_OUTPUT
          fi

      - name: Open issue on skill bug
        if: steps.triage.outputs.category == 'skill-bug' || steps.triage.outputs.category == 'harness-error'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try { body = fs.readFileSync('integration-test/report.md', 'utf8'); }
            catch (e) { body = `Integration test failed before generating a report.`; }
            const isHarness = '${{ steps.triage.outputs.category }}' === 'harness-error';
            const title = isHarness
              ? `Integration test harness crashed (${new Date().toISOString().slice(0,10)})`
              : `Integration test found skill bug (${new Date().toISOString().slice(0,10)})`;
            const summary = isHarness
              ? `The integration test harness itself crashed unexpectedly — this is a bug in the test code, not the skill.`
              : `The integration test ran generated code against the sandbox and found that the code Claude generated doesn't work against the live API. Likely causes: skill instructions are wrong, DATA_MODEL.md has outdated examples, or the Productboard API changed in a way the spec doesn't reflect yet.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `${summary}\n\n${body}\n\n[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['integration-test-failure', 'productboard-api']
            });

      - name: Warn on infra failure
        if: steps.triage.outputs.category == 'infra'
        run: |
          echo "::warning::Integration test had only infrastructure failures (5xx, timeouts). Not opening an issue. Check the workflow log for details."

      - name: Fail job on skill bug or harness error
        if: steps.triage.outputs.category == 'skill-bug' || steps.triage.outputs.category == 'harness-error'
        run: exit 1
