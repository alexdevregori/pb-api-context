name: Check Productboard API spec

on:
  schedule:
    # Daily at 14:00 UTC (~7am Pacific). Adjust to your timezone.
    - cron: '0 14 * * *'
  workflow_dispatch:  # manual trigger from the Actions tab
  push:
    branches: [main]
    paths:
      - 'watcher/**'
      - '.github/workflows/check-spec.yml'

permissions:
  contents: write   # to commit updated specs back to main
  issues: write     # to file an issue when breaking changes land

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install watcher deps
        working-directory: watcher
        run: npm ci || npm install

      - name: Run watcher
        working-directory: watcher
        run: node watch.mjs

      - name: Detect changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "pb-api-bot"
          git config user.email "pb-api-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync Productboard API spec ($(date -u +%Y-%m-%d))"
          git push

      - name: Check for breaking changes
        if: steps.changes.outputs.changed == 'true'
        id: breaking
        shell: bash
        run: |
          # Extract the most recent date block from CHANGELOG.md
          # (everything between the first "## " line and the next one)
          awk '
            /^## / { if (seen) exit; seen=1; print; next }
            seen { print }
          ' CHANGELOG.md > /tmp/recent_changes.md

          if grep -qE "\*\*(Endpoints removed|Schemas removed)" /tmp/recent_changes.md; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
            echo "Breaking changes detected in latest entry."
          else
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on breaking changes
        if: steps.breaking.outputs.breaking == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/recent_changes.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Productboard API breaking change detected (${new Date().toISOString().slice(0,10)})`,
              body: `The Productboard API spec changed in a way that may break existing code. Review the changes below and patch any consumers.\n\n${body}\n\nFull changelog: \`CHANGELOG.md\``,
              labels: ['breaking-change', 'productboard-api']
            });
